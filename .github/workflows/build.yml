#
# Builds the VM image on an arm64 Linux runner (Docker, Alpine aarch64). Every run keeps the
# image, its corresponding source and their checksums as artifacts. Only a pushed v* tag
# publishes them, in a job of its own, together as a GitHub release, the place the apps
# download vm_assets.zip from; pushes to main, pull requests and manual runs never do. A release
# is never replaced: a fixed image gets a new tag.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    name: VM image (Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build the image, notices and sources
        env:
          # the GitHub mirror of aports (builder/compliance.py) when GitLab turns the runner away
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=dev-${GITHUB_SHA::7}; fi
          GODSEON_VM_VERSION=$version ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: vm_assets
          path: |
            dist/vm_assets.zip
            dist/vm_assets-sources.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release (v* tags only)
    needs: vm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vm_assets
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; releases are not replaced" >&2
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS)
          unzip -p dist/vm_assets.zip vm_assets/compliance/SOURCE.md >notes.md
          gh release create "$GITHUB_REF_NAME" dist/vm_assets.zip dist/vm_assets-sources.tar.gz \
            dist/SHA256SUMS --verify-tag --title "GodseonDongle-VM ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
